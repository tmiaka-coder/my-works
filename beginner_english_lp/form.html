<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【サンプル】無料体験申込 | BEGINNER ENGLISH</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans JP', sans-serif; }
        /* 追加のカスタムCSS */
        .form-input:focus {
            outline: 3px solid #d97706;
            outline-offset: 2px;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <!-- ポートフォリオ用注意書き -->
    <div class="bg-amber-50 border-b border-amber-200 py-2 px-4 text-center text-xs text-amber-800 font-medium" role="note">
        【お知らせ】このフォームは制作実績公開用のサンプルであり、実際のお申し込みは受け付けておりません。
    </div>

    <header class="bg-white border-b border-slate-200 py-6">
        <div class="max-w-xl mx-auto px-4">
            <a href="index.html" class="text-xl font-black text-blue-900 tracking-tighter">BEGINNER ENGLISH</a>
        </div>
    </header>

    <main class="py-12 px-4">
        <div class="max-w-xl mx-auto bg-white rounded-3xl shadow-sm border border-slate-200 p-8 md:p-12">
            <h1 class="text-2xl font-bold text-center mb-2">無料体験お申し込み</h1>
            <p class="text-center text-slate-500 mb-10 text-sm">最短1分で完了します</p>

            <!-- サンプルのためactionは空、またはGoogleフォームURLに -->
            <form action="#" method="GET" class="space-y-6">
                <div>
                    <label for="name" class="block font-bold mb-2">お名前 <span class="text-red-500 text-xs">必須</span></label>
                    <input type="text" id="name" name="name" placeholder="山田 太郎" required 
                           class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 form-input">
                </div>

                <div>
                    <label for="email" class="block font-bold mb-2">メールアドレス <span class="text-red-500 text-xs">必須</span></label>
                    <input type="email" id="email" name="email" placeholder="example@email.com" required 
                           class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 form-input">
                </div>

                <div>
                    <label for="tel" class="block font-bold mb-2">電話番号</label>
                    <input type="tel" id="tel" name="tel" placeholder="090-1234-5678" 
                           class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 form-input">
                </div>

                <div>
                    <label for="level" class="block font-bold mb-2">現在の英語レベル</label>
                    <select id="level" name="level" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 form-input cursor-pointer">
                        <option value="beginner">初心者（中学レベル）</option>
                        <option value="basic">基礎あり</option>
                        <option value="conversation">日常会話可能</option>
                    </select>
                </div>

                <div>
                    <label for="datetime" class="block font-bold mb-2">希望日時</label>
                    <input type="datetime-local" id="datetime" name="datetime" 
                           class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 form-input">
                </div>

                <div class="pt-4">
                    <button type="submit" class="w-full bg-blue-900 text-white font-black py-4 rounded-2xl text-lg hover:bg-blue-800 transition-colors shadow-lg shadow-blue-900/10">
                        内容を確認して予約する
                    </button>
                    <p class="text-center text-xs text-slate-400 mt-4 leading-relaxed">
                        ※本フォームは動作テスト用です。入力された内容は送信されません。<br>
                        ※プライバシーポリシー（サンプル）に基づき管理されます。
                    </p>
                </div>
            </form>
        </div>

        <div class="text-center mt-8">
            <a href="index.html" class="text-sm text-slate-500 hover:text-blue-900 transition-colors underline decoration-slate-300">
                ← トップページに戻る
            </a>
        </div>
    </main>

    <footer class="py-12 border-t border-slate-200 text-center text-slate-400 text-xs">
        <p>&copy; 2024 Portfolio Sample. All rights reserved.</p>
    </footer>

</body>
</html>
